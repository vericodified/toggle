<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuff | Premium Theme Toggle</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstcom" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="projm" aria-hidden="true">Project loading</div>

<div class="Typewriter">
  <p>Premium Theme Toggle</p>
</div>

<main class="card">
  <input type="checkbox" id="check" class="discheck">
  
  <span class="text"></span>

  <!-- Create a wrapper row for the switch -->
  <div class="switch-row">
    <label for="check" class="switch" aria-label="Toggle background theme">
      <span class="knob"></span>
    </label>
  </div>
</main>

  
</body>
</html>
